<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#D89A9E" />
  <title>Happy Birthday, Marion 💌</title>
  <meta name="description" content="A little something I made just for you." />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="page-landing">
  <!-- Soft petals + hearts drift down here (filled by script.js) -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!-- Music toggle (muted by default) -->
  <button class="music-toggle is-muted" id="musicToggle" type="button"
          aria-label="Play background music" aria-pressed="false">
    <span class="music-icon" aria-hidden="true">♪</span>
  </button>

  <main class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">
        <span class="hero-title-top">Happy Birthday,</span>
        <!-- Your girlfriend's name is set in script.js (CONFIG.herName) -->
        <span class="hero-name her-name">Ms.Mburu</span>
      </h1>

      <p class="hero-sub">A little something I made just for you…</p>

      <a class="btn-glow" href="birthday.html" data-transition>
        Open Your Surprise <span aria-hidden="true">💌</span>
      </a>
    </div>
  </main>

  <!-- Page transition veil -->
  <div class="page-veil" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
